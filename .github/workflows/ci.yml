name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # The plugin ships to Desktop users on all three platforms and its backend
    # uses only pathlib/tempfile/os.replace, so the suite runs everywhere rather
    # than on the maintainer's machine alone. `matrix.os` is a fixed list
    # defined below, never untrusted event input.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run JS tests
        run: node --test tests/*.test.mjs

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: pip install fastapi PyYAML

      # check-packs.py imports PyYAML at module scope, so it runs after the
      # interpreter and its dependency exist. The data contract is a gate: a
      # skin that loses a palette, a pack that loses every member, or a
      # duplicate label fails here instead of shipping.
      - name: The catalogue obeys its own contract
        run: python scripts/check-packs.py

      - name: Backend tests (plugin API)
        run: python -m unittest tests.test_plugin_api

      - name: Generator tests
        run: python -m unittest tests.test_regenerate

      - name: Skin-contract tests
        run: python -m unittest tests.test_skin_contract

  build-is-current:
    # desktop/plugin.js is committed because the installer loads it, so a
    # template edit that was never regenerated would ship stale code. Rebuilding
    # must be a no-op.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: pip install fastapi PyYAML

      - name: The catalogue obeys its own contract
        run: python scripts/check-packs.py

      # `hermes plugins validate .` is the catalog admission gate, but the Hermes
      # CLI is not installable from PyPI yet (hermes-agent 0.19.0 ships no
      # `validate` subcommand), so CI cannot run that exact check. This script owns
      # the part of the gate that needs no CLI: every version locus, the manifest
      # fields, the entry points, the committed build's stamp, and tracked junk.
      - name: The package agrees with itself
        run: python scripts/check-package.py

      - name: Rebuild the shipped plugin
        run: python scripts/regenerate.py

      - name: The committed build must match its template
        run: git diff --exit-code -- desktop/plugin.js gateway-skins docs/DERIVED-PALETTES.md

